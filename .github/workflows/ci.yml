name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly dependency audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install core + dev dependencies (no ML frameworks)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Dependency consistency
        run: pip check
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Tests (offline; mocked providers and models)
        run: python -m pytest -q --ignore=tests/browser -m "not real_model"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install audit tools
        run: pip install pip-audit==2.10.1 uv
      - name: Audit core + dev requirements
        run: |
          uv pip compile -q --python-version 3.13 requirements-dev.txt -o core.lock
          pip-audit --progress-spinner off --no-deps --disable-pip -r core.lock
      - name: Audit optional ML requirements (resolved, not installed)
        run: |
          uv pip compile -q --python-version 3.13 --python-platform x86_64-manylinux_2_28 requirements.txt requirements-ml.txt -o ml.lock
          pip-audit --progress-spinner off --no-deps --disable-pip -r ml.lock

  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m pytest -q tests/browser
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/browser/artifacts/
          if-no-files-found: ignore
          retention-days: 7
